<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D20 Revamp — Feat Compendium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--ink:#0e1018;
--ink-2:#171925;
--ink-3:#202334;
--parchment:#f3eedf;
--parchment-dim:#e0d8bf;
--hairline:#36394d;
--gold:#d3ac43;
--dark-gold:#b69028;

--cat-animal-companion: #78dc6e;
--cat-channeling: #32d2b4;
--cat-combat: #41c3f5;
--cat-combat-style: #c489ff;
--cat-general: #ff96c8;
--cat-grit-panache: #ff4b4b;
--cat-item-creation: #ff9b50;
--cat-metamagic: #e4c450;
--cat-teamwork: #f0f0f0b4;

}
*{box-sizing:border-box;}
html,body{
  margin:0;
  padding:0;
}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:'Crimson Pro',serif;
  font-size:17px;
  line-height:1.5;
  min-height:100vh;
}
::selection{
  background:var(--gold);
  color:var(--ink);
}

/* ---------- Layout shell ---------- */
.app{
  display:grid;
  grid-template-columns:320px 1fr;
  min-height:100vh;
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--hairline);}
}

/* ---------- Sidebar ---------- */
.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  background:var(--ink-2);
  border-right:1px solid var(--hairline);
  padding:28px 22px 40px;
  display:flex;
  flex-direction:column;
  gap:22px;
}
@media (max-width:900px){
  .sidebar{height:auto; max-height:none; position:relative;}
}

.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:4px;
}
.brand .mark{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:1.5rem;
  letter-spacing:.03em;
  color:var(--gold);
}
.brand .sub{
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--parchment-dim);
}

.search-wrap{
  position:relative;
}
.search-wrap input{
  width:100%;
  background:var(--ink-3);
  border:1px solid var(--hairline);
  border-radius:6px;
  color:var(--parchment);
  font-family:'Crimson Pro',serif;
  font-size:1.02rem;
  padding:12px 14px 12px 38px;
  outline:none;
  transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--gold);}
.search-wrap input::placeholder{color:var(--parchment-dim);}
.search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  opacity:.6;
  pointer-events:none;
}
.search-clear-icon{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  color:#e0525f;
  cursor:pointer;
  display:none;
}
.search-wrap.has-query .search-clear-icon{display:block;}
.search-wrap.has-query input{padding-right:36px;}

/* Narrower, shorter search variant (e.g. Prerequisites search) */
.search-wrap-sm{
  width:97%;
}
.search-wrap-sm input{
  font-size:.88rem;
  padding:8px 12px 8px 32px;
}
.search-wrap-sm .search-icon{
  left:10px;
  width:14px;
  height:14px;
}
.search-wrap-sm .search-clear-icon{
  right:10px;
  width:14px;
  height:14px;
}
.search-wrap-sm.has-query input{padding-right:30px;}

.search-hint{
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;
  color:var(--parchment-dim);
  letter-spacing:.02em;
  margin-top:6px;
  line-height:1.4;
}

.filter-group{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.filter-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.74rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--parchment);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--gold);
  font-weight: 600;
}
.filter-label button{
  background:none;
  border:none;
  color:var(--gold);
  font-family:'JetBrains Mono',monospace;
  text-transform:uppercase;
  font-size:.64rem;
  font-weight:700;
  letter-spacing:.08em;
  cursor:pointer;
  padding:0;
  opacity:.85;
}
.filter-label button:hover{
  opacity:1;
  text-decoration:underline;
}

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.chip{
  width:130px;
  justify-content:left;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;
  padding:5px 10px;
  border-radius:20px;
  border:1px solid var(--hairline);
  background:var(--ink-3);
  color:var(--parchment-dim);
  cursor:pointer;
  user-select:none;
  transition:all .12s;
  display:flex;
  align-items:center;
  gap:6px;
  line-height:1.2;
}
.chip .dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--dotc,var(--parchment-dim));
  flex-shrink:0;
}
.chip:hover{border-color:var(--parchment-dim);color:var(--parchment);}
.chip.active {
  background:color-mix(in srgb, var(--chipc, var(--gold)) 85%, var(--ink-2));
  border-color:var(--chipc, var(--gold));
  color: #ffffff;
  font-weight: 700;
  text-shadow: 3px 3px 2px #000;
}
.chip.active .dot{background:var(--ink);}

select.select-filter{
  width:100%;
  background:var(--ink-3);
  border:1px solid var(--hairline);
  color:var(--parchment);
  font-family:'Crimson Pro',serif;
  font-size:.95rem;
  padding:9px 10px;
  border-radius:6px;
  outline:none;
}
select.select-filter:focus{border-color:var(--gold);}

.sort-row{
  display:flex;
  gap:8px;
}
.sort-row select{flex:1;}

/* Filters / Sorting */
.filters-collapse{display:contents;}
.filters-summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.92rem;
  font-weight: 700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--gold);
  padding:6px 0 2px 0;
  border-top:2px solid var(--gold);
  margin-bottom:4px;
}
.filters-header-actions{
  display:flex;
  align-items:center;
  gap:14px;
}
.filters-header-actions #clearAll{
  background:none;
  border:none;
  color:var(--gold);
  font-family:'JetBrains Mono',monospace;
  font-size:.66rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  padding:0;
  opacity:.85;
}
.filters-header-actions #clearAll:hover{
  opacity:1;
  text-decoration:underline;
}
.fs-arrow{display:none;}
.filters-inner{
  display:flex;
  flex-direction:column;
  gap:22px;
}
@media (max-width:900px){
  .filters-collapse{display:block;}
  .filters-inner{margin-top:16px;}
  .filters-inner.collapsed{display:none;}
  .filters-summary{cursor:pointer;}
  .fs-arrow{
    display:inline-block;
    transition:transform .15s;
  }
  .filters-summary.open .fs-arrow{transform:rotate(180deg);}
}

/* Page title (counts) */
.page-title-desktop{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:12px;
  gap:10px;
  flex-wrap:wrap;
}
.page-title-desktop h1{
  font-family:'Cinzel',serif;
  font-size:1.1rem;
  font-weight:600;
  color:var(--parchment-dim);
  margin:0;
  letter-spacing:.02em;
}

/* ---------- Main / list ---------- */
.main{
  padding:16px 40px 80px;
  width:100%;
}
@media (max-width:900px){
  .main{padding:20px 18px 60px;}
}

.mobile-header{display:none;}
@media (max-width:900px){
  .mobile-header{display:block;margin-bottom:10px;}
}

.list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.feat-card{
  background:var(--ink-2);
  border:1px solid var(--hairline);
  border-left:5px solid var(--cardc,var(--gold));
  border-radius:8px;
  overflow:hidden;
  transition:border-color .15s;
}
.feat-card.open{
  border-color:var(--cardc,var(--gold));
}

.feat-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:8px 18px;
  cursor:pointer;
}
.feat-head:hover{background:rgba(255,255,255,0.02);}

.feat-title-block{
  display:flex;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
  min-width:0;
}
.feat-name{
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:1.08rem;
  color:var(--parchment);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.feat-meta-inline{
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;
  color:var(--parchment-dim);
  white-space:nowrap;
}
.feat-category-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:.76rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--cardc,var(--gold));
  white-space:nowrap;
}

.feat-right{
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
}
.feat-badge{
  font-family:'Crimson Pro',serif;
  font-style:italic;
  font-size:1rem;
  color:var(--parchment-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:320px;
  display:none;
}
@media (min-width:640px){.feat-badge{display:inline-block;}}
@media (min-width:1100px){.feat-badge{max-width:460px;}}

.chevron{
  width:14px;height:14px;
  flex-shrink:0;
  opacity:.5;
  transition:transform .18s;
}
.feat-card.open .chevron{transform:rotate(180deg);}

.feat-body{
  display:none;
  padding:0 18px 20px;
  border-top:1px solid var(--hairline);
}
.feat-card.open{
  background:color-mix(in srgb, var(--cardc, var(--gold)) 5%, var(--ink-2));
}
.feat-card.open .feat-body{
  display:block;
  padding-top:16px;
}
.feat-card.open .feat-head{
  background:color-mix(in srgb, var(--cardc, var(--gold)) 25%, var(--ink-2));
}

.feat-flavor{
  font-family:'Crimson Pro',serif;
  font-style:italic;
  font-size:1.1rem;
  color:var(--parchment-dim);
  margin:0 0 12px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
  margin-bottom:10px;
  padding-bottom:0px;
}
.stat{
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:10px 14px;
  background:var(--ink-2);
  border-radius:6px;
}
.copyable{
  cursor:copy;
  transition:background .15s;
  border-radius:4px;
}
.copyable:hover{
  background:rgba(255,255,255,0.04);
}
.copyable.copied{
  background:rgba(196,162,77,0.18);
}
.stat-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.82rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gold);
}
.stat-value{
  font-size:1rem;
  color:var(--parchment);
}

.feat-section{
  margin-top:10px;
  padding-top:14px;
}
.feat-section-title{
  font-family:'JetBrains Mono',monospace;
  font-size:.86rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:8px;
}
.feat-desc{
  font-size:1.1rem;
  color:var(--parchment-dim);
  white-space:pre-wrap;
}
.feat-desc p{margin:0 0 12px;}
.feat-desc b{
  color:var(--parchment);
  font-weight:600;
}

.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:60px 20px;
  color:var(--parchment-dim);
  font-family:'Crimson Pro',serif;
  text-align:center;
}
.empty-state .big{
  font-family:'Cinzel',serif;
  font-size:1.2rem;
  color:var(--gold);
}

/* scrollbar */
.sidebar::-webkit-scrollbar{width:8px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{
  background:var(--hairline);
  border-radius:4px;
}

/* Floating copied tooltip */
.copy-tooltip{
  position:fixed;
  transform:translate(-50%,-140%);
  background:var(--dark-gold);
  color:var(--ink);
  padding:6px 10px;
  border-radius:6px;
  font-family:'JetBrains Mono',monospace;
  font-size:.78rem;
  font-weight:700;
  pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
  opacity:0;
  transition:opacity .18s, transform .18s;
  z-index:9999;
}
.copy-tooltip.show{opacity:1; transform:translate(-50%,-170%);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">D20 Revamp</div>
      <div class="sub" id="brandSub">Feat Compendium · 587 Feats</div>
    </div>

    <div class="search-wrap" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search everything…" autocomplete="off">
      <svg class="search-clear-icon" id="searchClearIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>

    <div class="filters-collapse" id="filtersCollapse">
      <div class="filters-summary" id="filtersSummary">
        <span>Filters</span>
        <div class="filters-header-actions">
          <button id="clearAll" type="button">clear all</button>
          <span class="fs-arrow">▾</span>
        </div>
      </div>
      <div class="filters-inner" id="filtersInner">
        <div class="filter-group">
          <div class="filter-label"><span>Categories</span><button id="clearCategories" type="button">clear</button></div>
          <div class="chip-row" id="categoryChips"></div>
        </div>

        <div class="filter-group">
          <div class="filter-label"><span>Prerequisites</span><button id="clearPrereq" type="button">clear</button></div>
          <div class="search-wrap search-wrap-sm" id="prereqSearchWrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="prereqSearchInput" type="text" placeholder="Search Prerequisites..." autocomplete="off">
            <svg class="search-clear-icon" id="prereqSearchClearIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          <div class="chip-row" id="prereqChips">
            <div class="chip" data-prereq="none">None</div>
            <div class="chip" data-prereq="some">At least one</div>
          </div>
        </div>

        <div class="filters-summary" id="sortingSummary">
          <span>Sorting</span>
          <div class="filters-header-actions">
            <span class="fs-arrow">▾</span>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-label"><span>Sort by</span></div>
          <div class="sort-row">
            <select class="select-filter" id="sortSelect">
              <option value="name">Name (A–Z)</option>
              <option value="category">Category</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-title-desktop">
      <h1 id="listTitle">587 Feats Listed</h1>
    </div>
    <div class="list" id="featList"></div>
  </main>
</div>

    ].filter(Boolean).join(' ').toLowerCase();
  });

  // Build category list (in first-seen order from the data)
  const allCategories = Array.from(new Set(FEATS_DATA.map(f=>f.category))).sort();
  const categoryChips = document.getElementById('categoryChips');
  allCategories.forEach(cat=>{
    const slug = slugify(cat);
    const chip = document.createElement('div');
    chip.className='chip';
    chip.style.setProperty('--dotc', `var(--cat-${slug})`);
    chip.style.setProperty('--chipc', `var(--cat-${slug})`);
    chip.dataset.cat = cat;
    chip.innerHTML = `<span class="dot"></span>${cat}`;
    chip.addEventListener('click', ()=>{
      if(state.categories.has(cat)) state.categories.delete(cat);
      else state.categories.add(cat);
      chip.classList.toggle('active');
      render();
    });
    categoryChips.appendChild(chip);
  });

  // Wire up the (static, already-in-markup) Prerequisites chips as a single-select toggle
  const prereqChips = document.getElementById('prereqChips');
  prereqChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const val = chip.dataset.prereq;
      if(state.prereq === val){
        state.prereq = null;
        chip.classList.remove('active');
      } else {
        state.prereq = val;
        prereqChips.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
      }
      render();
    });
  });

  // Mobile filters collapse toggle (desktop always shows filters via CSS)
  const filtersInner = document.getElementById('filtersInner');
  const filtersSummary = document.getElementById('filtersSummary');
  function isMobile(){ return window.matchMedia('(max-width:900px)').matches; }
  if(isMobile()) filtersInner.classList.add('collapsed');
  filtersSummary.addEventListener('click', (e)=>{
    if(e.target.closest('#clearAll')) return;
    filtersInner.classList.toggle('collapsed');
    filtersSummary.classList.toggle('open');
  });
  window.addEventListener('resize', ()=>{
    if(!isMobile()){
      filtersInner.classList.remove('collapsed');
    }
  });

  document.getElementById('clearCategories').addEventListener('click', ()=>{
    state.categories.clear();
    document.querySelectorAll('#categoryChips .chip').forEach(el=>el.classList.remove('active'));
    render();
  });

  const searchInputEl = document.getElementById('searchInput');
  const searchWrapEl = document.getElementById('searchWrap');
  const searchClearIcon = document.getElementById('searchClearIcon');

  function syncSearchClearIcon(){
    searchWrapEl.classList.toggle('has-query', searchInputEl.value.length > 0);
  }

  searchInputEl.addEventListener('input', e=>{
    state.query = e.target.value.trim().toLowerCase();
    syncSearchClearIcon();
    render();
  });
  searchClearIcon.addEventListener('click', ()=>{
    searchInputEl.value = '';
    state.query = '';
    syncSearchClearIcon();
    searchInputEl.focus();
    render();
  });

  const prereqSearchInputEl = document.getElementById('prereqSearchInput');
  const prereqSearchWrapEl = document.getElementById('prereqSearchWrap');
  const prereqSearchClearIcon = document.getElementById('prereqSearchClearIcon');

  function syncPrereqSearchClearIcon(){
    prereqSearchWrapEl.classList.toggle('has-query', prereqSearchInputEl.value.length > 0);
  }

  prereqSearchInputEl.addEventListener('input', e=>{
    state.prereqQuery = e.target.value.trim().toLowerCase();
    syncPrereqSearchClearIcon();
    render();
  });
  prereqSearchClearIcon.addEventListener('click', ()=>{
    prereqSearchInputEl.value = '';
    state.prereqQuery = '';
    syncPrereqSearchClearIcon();
    prereqSearchInputEl.focus();
    render();
  });

  document.getElementById('clearPrereq').addEventListener('click', ()=>{
    state.prereq = null;
    document.querySelectorAll('#prereqChips .chip').forEach(el=>el.classList.remove('active'));
    state.prereqQuery = '';
    prereqSearchInputEl.value = '';
    syncPrereqSearchClearIcon();
    render();
  });

  document.getElementById('clearAll').addEventListener('click', (e)=>{
    e.stopPropagation();
    state.query = '';
    searchInputEl.value = '';
    syncSearchClearIcon();
    state.categories.clear();
    document.querySelectorAll('#categoryChips .chip').forEach(el=>el.classList.remove('active'));
    state.prereq = null;
    document.querySelectorAll('#prereqChips .chip').forEach(el=>el.classList.remove('active'));
    state.prereqQuery = '';
    prereqSearchInputEl.value = '';
    syncPrereqSearchClearIcon();
    render();
  });

  document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });

  // show a floating "Copied to Clipboard" tooltip at click position
  function showCopiedTooltip(x,y){
    let tip = document.createElement('div');
    tip.className = 'copy-tooltip';
    tip.textContent = 'Copied to Clipboard';
    document.body.appendChild(tip);
    tip.style.left = (x) + 'px';
    tip.style.top = (y) + 'px';
    requestAnimationFrame(()=> tip.classList.add('show'));
    setTimeout(()=>{
      tip.classList.remove('show');
      setTimeout(()=>tip.remove(), 250);
    }, 900);
  }

  document.getElementById('featList').addEventListener('click', e=>{
    const el = e.target.closest('.copyable');
    if(!el) return;
    if(el.classList.contains('feat-name')) return; // handled separately below, depends on open/closed state
    const text = el.dataset.copy;
    if(!text) return;
    navigator.clipboard.writeText(text).then(()=>{
      el.classList.add('copied');
      showCopiedTooltip(e.clientX, e.clientY);
      setTimeout(()=>el.classList.remove('copied'), 500);
    }).catch(()=>{});
  });

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function escapeRegExp(str){
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function boldLeadingLabel(text){
    return (text||'').split('\n').map(line=>{
      const escaped = escapeHtml(line);
      return escaped.replace(/^(\s*(?:-\s*)?)((?:\S+\s+){0,4}\S*?:)/, '$1<b>$2</b>');
    }).join('\n');
  }

  // Same leading-label rule as boldLeadingLabel, but for plain-text clipboard output:
  // wraps the label in Markdown ** ** instead of <b> and skips HTML escaping.
  function mdBoldLeadingLabel(text){
    return (text||'').split('\n').map(line=>{
      return line.replace(/^(\s*(?:-\s*)?)((?:\S+\s+){0,4}\S*?:)/, '$1**$2**');
    }).join('\n');
  }

  function matchesQueryOnBlob(blob, query){
    if(!query) return true;
    const q = query.trim().toLowerCase();
    if(q.length===0) return true;
    const safe = escapeRegExp(q);
    const rx = new RegExp('\\b' + safe + '\\b');
    return rx.test(blob);
  }

  function matchesQuery(feat, query){
    return matchesQueryOnBlob(feat._blob, query);
  }

  function matchesPrereqQuery(feat, query){
    return matchesQueryOnBlob(feat._prereqBlob, query);
  }

  function cardHTML(f){
    const cVar = `var(--cat-${f._slug})`;
    const isOpen = state.open.has(f._idx);

    const flavorHtml = f.flavor_text ? `<p class="feat-flavor copyable" data-copy="${escapeHtml(f.flavor_text)}">${escapeHtml(f.flavor_text)}</p>` : '';

    const prereqHtml = (f.prerequisites && f.prerequisites.length>0) ? `\n        <div class="feat-section">\n          <div class="feat-section-title">Prerequisites</div>\n          <div class="feat-desc copyable" data-copy="${escapeHtml(mdBoldLeadingLabel(f.prerequisites))}"><div>${boldLeadingLabel(f.prerequisites)}</div></div>\n        </div>` : '';

    // Benefits / Normal / Special render as separate labeled sections (same look as
    // before) but share a single clickable/copyable zone covering all three.
    const groupFields = [
      ['Benefits', f.benefits],
      ['Normal', f.normal],
      ['Special', f.special]
    ].filter(([label,val])=>val && val.length>0);

    const groupInnerHtml = groupFields.map(([label,val])=>{
      return `\n        <div class="feat-section">\n          <div class="feat-section-title">${escapeHtml(label)}</div>\n          <div class="feat-desc"><div>${boldLeadingLabel(val)}</div></div>\n        </div>`;
    }).join('');

    const combinedCopyText = mdBoldLeadingLabel(
      groupFields.map(([label,val])=> label==='Benefits' ? val : `${label}: ${val}`).join('\n\n')
    );

    const groupHtml = groupFields.length
      ? `<div class="feat-copy-group copyable" data-copy="${escapeHtml(combinedCopyText)}">${groupInnerHtml}\n        </div>`
      : '';

    return `\n    <div class="feat-card${isOpen?' open':''}" style="--cardc:${cVar}" data-idx="${f._idx}">\n      <div class="feat-head" data-toggle="${f._idx}">\n        <div class="feat-title-block">\n          <span class="feat-name copyable" data-copy="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>\n          <span class="feat-category-tag">${escapeHtml(f.category)}</span>\n        </div>\n        <div class="feat-right">\n          <span class="feat-badge" title="${escapeHtml(f.flavor_text||'')}">${escapeHtml(f.flavor_text||'')}</span>\n          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>\n        </div>\n      </div>\n      <div class="feat-body">\n        ${flavorHtml}${prereqHtml}${groupHtml}\n      </div>\n    </div>`;
  }

  function filtered(){
    let list = FEATS_DATA;
    if(state.query){
      list = list.filter(f=>matchesQuery(f, state.query));
    }
    if(state.categories.size){
      list = list.filter(f=>state.categories.has(f.category));
    }
    if(state.prereq === 'none'){
      list = list.filter(f=>!f.prerequisites);
    } else if(state.prereq === 'some'){
      list = list.filter(f=>!!f.prerequisites);
    }
    if(state.prereqQuery){
      list = list.filter(f=>matchesPrereqQuery(f, state.prereqQuery));
    }
    const sorted = list.slice();
    if(state.sort==='name'){
      sorted.sort((a,b)=>a.name.localeCompare(b.name));
    } else if(state.sort==='category'){
      sorted.sort((a,b)=>(a.category||'').localeCompare(b.category||'') || a.name.localeCompare(b.name));
    }
    return sorted;
  }

  function render(){
    const results = filtered();
    document.getElementById('listTitle').textContent = `${results.length} Feat${results.length!==1?'s':''} Listed`;
    const listEl = document.getElementById('featList');
    if(results.length===0){
      listEl.innerHTML = `<div class="empty-state"><span class="big">No feats found</span>Try a different search term or clear a filter.</div>`;
      return;
    }
    listEl.innerHTML = results.map(cardHTML).join('');
    listEl.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        const idx = parseInt(el.dataset.toggle,10);
        const isOpen = state.open.has(idx);
        const nameEl = e.target.closest('.feat-name');
        if(nameEl && isOpen){
          // card is already open -- clicking the name copies it instead of collapsing the card
          const text = nameEl.dataset.copy;
          if(text){
            navigator.clipboard.writeText(text).then(()=>{
              nameEl.classList.add('copied');
              try{ showCopiedTooltip(e.clientX, e.clientY); }catch(err){}
              setTimeout(()=>nameEl.classList.remove('copied'), 500);
            }).catch(()=>{});
          }
          return;
        }
        if(isOpen) state.open.delete(idx); else state.open.add(idx);
        const card = listEl.querySelector(`.feat-card[data-idx="${idx}"]`);
        card.classList.toggle('open');
      });
    });
  }

  render();
})();
</script>
</body>
</html>
