<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D20 Revamp</title>
<script>
(function(){
  var theme = localStorage.getItem('theme');
  if (theme && theme !== 'gold') document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/theme-toggle.css">
</head>
<body>

  <div class="theme-toggle" id="themeToggle">
  <button
    class="theme-toggle-main"
    id="themeToggleBtn"
    type="button"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="themeTogglePopup"
    aria-label="Change color theme"
  ></button>

  <div class="theme-toggle-popup" id="themeTogglePopup" role="menu" hidden>
    <button class="theme-swatch" type="button" role="menuitem" data-theme-choice="gold" aria-label="Gold theme"></button>
    <button class="theme-swatch" type="button" role="menuitem" data-theme-choice="blue" aria-label="Blue theme"></button>
    <button class="theme-swatch" type="button" role="menuitem" data-theme-choice="green" aria-label="Green theme"></button>
    <button class="theme-swatch" type="button" role="menuitem" data-theme-choice="orange" aria-label="Orange theme"></button>
    <button class="theme-swatch" type="button" role="menuitem" data-theme-choice="red" aria-label="Red theme"></button>
    <button class="theme-swatch" type="button" role="menuitem" data-theme-choice="parchment" aria-label="Parchment theme"></button>
  </div>
</div>


  <div class="hero">
    <!-- Logo: reveals first (outside-in) -->
    <div class="hero-image" id="heroImage"></div>

    <!-- Title: reveals after the logo -->
    <div class="hero-title" id="heroTitle"></div>

    <!-- Buttons: independent of both images, no transition -->
    <div class="hero-buttons-wrap">
        <div class="hero-buttons">
          <a class="nav-btn" href="armor_catalogue.html">
            <span class="btn-main">Armor</span>
            <span class="btn-sub">Catalogue</span>
          </a> 
          <a class="nav-btn" href="feat_library.html">
            <span class="btn-main">Feat</span>
            <span class="btn-sub">Library</span>
          </a> 
          <a class="nav-btn" href="magic_items_Vault.html">
            <span class="btn-main">Magic Item</span>
            <span class="btn-sub">Vault</span>
          </a> 
          <a class="nav-btn" href="monster_bestiary.html">
            <span class="btn-main">Monster</span>
            <span class="btn-sub">Bestiary</span>
          </a>          
        </div>
        <div class="hero-buttons">
          <a class="nav-btn" href="npc_registry.html">
            <span class="btn-main">NPC</span>
            <span class="btn-sub">Registry</span>
          </a>    
          <a class="nav-btn" href="rune_repository.html">
            <span class="btn-main">Rune</span>
            <span class="btn-sub">Repository</span>
          </a>          
          <a class="nav-btn" href="spell_compendium.html">
            <span class="btn-main">Spell</span>
            <span class="btn-sub">Compendium</span>
          </a>
          <a class="nav-btn" href="weapon_arsenal.html">
            <span class="btn-main">Weapon</span>
            <span class="btn-sub">Arsenal</span>
          </a>
        </div>
    </div>
  </div>

<script src="js/base.js"></script>
<script>
(function(){
  const heroImage = document.getElementById('heroImage');
  const heroTitle = document.getElementById('heroTitle');

  const themeImages = {
    gold: 'd20.png',
    blue: 'd20_blue.png',
    orange: 'd20_orange.png',
    green: 'd20_green.png',
    red: 'd20_red.png',
  };

  const themeTitles = {
    gold: 'd20_title.png',
    blue: 'd20_title_blue.png',
    orange: 'd20_title_orange.png',
    green: 'd20_title_green.png',
    red: 'd20_title_red.png',
  };

  function setHeroImage(theme){
    const file = themeImages[theme] || themeImages.gold;
    heroImage.style.backgroundImage = `url('../pictures/${file}')`;
    const titleFile = themeTitles[theme] || themeTitles.gold;
    heroTitle.style.backgroundImage = `url('../pictures/${titleFile}')`;
  }

  initThemeToggle(setHeroImage);
})();
</script>

</body>
</html>
