<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D20 Revamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--ink:#0e1018;
--ink-2:#171925;
--ink-3:#202334;
--parchment:#f3eedf;
--parchment-dim:#e0d8bf;
--hairline:#36394d;
--gold:#d3ac43;
--dark-gold:#b69028;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:'Crimson Pro',serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0px 24px 24px 24px;
}
::selection{background:var(--gold);color:var(--ink);}

.hero{
  position:relative;
  width:1000px;
  height:1000px;
  max-width:100%;
  min-width:1000px;
}

.hero-image{
  position:absolute;
  top:0px;
  left:40px;
  right:40px;
  bottom:0;
  background-image:url('pictures/d20.png');
  background-size:100% 100%; /* stretch to fill the fixed 800x600 box */
  background-repeat:no-repeat;
  overflow:hidden;
}

.hero-buttons{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:20px;
  justify-content:center;
  padding:56px 28px 26px;
  background:linear-gradient(to top, rgba(14,16,24,0.92) 0%, rgba(14,16,24,0.6) 55%, rgba(14,16,24,0) 100%);
  z-index:1;
}

.nav-btn{
  flex:1 1 0;
  max-width:340px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-decoration:none;
  background:rgba(23,25,37,0.82);
  border: 1px solid color-mix(in srgb, var(--parchment-dim) 60%, var(--ink-3));
  border-radius:10px;
  padding:14px 16px;
  transition:border-color .18s, background .18s, transform .18s;
}
.nav-btn:hover{
  border-color:var(--gold);
  background:rgba(23,25,37,0.95);
  transform:translateY(-2px);
}
.nav-btn:active{transform:translateY(0px);}
.nav-btn .btn-main{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:2rem;
  color:var(--gold);
  letter-spacing:.1em;
}
.nav-btn .btn-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:1rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--parchment-dim);
}

@media (max-width:640px){
  .hero{width:100%;height:70vh;min-height:420px;}
  .nav-btn .btn-main{font-size:1.4rem;}
}
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-image">
      <div class="hero-buttons">
        <a class="nav-btn" href="feat_library.html">
          <span class="btn-main">Feat</span>
          <span class="btn-sub">Library</span>
        </a>        
        <a class="nav-btn" href="spell_compendium.html">
          <span class="btn-main">Spell</span>
          <span class="btn-sub">Compendium</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
